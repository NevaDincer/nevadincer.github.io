<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<title>{% if page.title and page.title != "" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
{% seo title=false %}
{% feed_meta %}
{% assign v = site.time | date: '%s' %}
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}?v={{ v }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}?v={{ v }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v={{ v }}">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ v }}">
{% if page.layout == "post" %}
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}?v={{ v }}">
{% endif %}
{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
{% endif %}
<script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ v }}"></script>
