items:
  - title: Engineering Intern - Akdoğan Tech
    date: Aug - Sep 2026 · Cyberpark, Ankara
    tag: industry
    in_progress: false
    body: Akdoğan Tech is a defense and unmanned systems company in Ankara. Over four weeks I built a Webots simulation of an unmanned surface vehicle and connected it to ArduPilot's autopilot software through MAVLink, working through manual control, obstacle detection and sensor integration, then connecting the simulation to QGroundControl and building a ROS 2 telemetry bridge with a live dashboard. Partway through I dropped the obstacle-avoidance script I had written myself and moved to ArduPilot's own avoidance system, since the vehicle had to be drivable from any standard ground control software and my version would have been invisible to it.
    blog_slug: "ardupilot-mavlink-qgroundcontrol-ros2"

