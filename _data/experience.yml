    body: Formed and captained a 5-person team from computer, electrical-electronics, and mechanical engineering for Turkey's national autonomous marine vehicle competition. Specified the vision and control software architecture, covering buoy detection and a mission state machine across a ROS 2 node structure, and authored the software sections of the technical reports. The team cleared the first qualification stage and was eliminated at the design report stage.
